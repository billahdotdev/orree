    <!-- ── Fonts ────────────────────────────────────────────────────────
         Self-hosted from /public/fonts (see src/index.css for the @font-face
         rules and the metric-matched fallbacks).

         Was: 3 families × 10 weights off fonts.googleapis.com. Bengali glyph
         coverage runs roughly 8× a Latin subset, and Google Fonts costs two
         extra DNS+TLS handshakes plus two serial round-trips — the CSS, then
         the font files — before a single branded character can paint. On a
         Dhaka 4G handset that was the largest single item on the critical
         path, and your ad spend was paying for it.

         Now: 4 weights (the ones the codebase actually uses), same origin,
         cached immutable for a year, zero third-party connections.
         `npm run fonts:sync` re-copies them from the @fontsource packages.
         ──────────────────────────────────────────────────────────────── -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/anek-bangla-bengali-800.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hind-siliguri-bengali-400.woff2" />

    <!-- ── Analytics & Pixel ────────────────────────────────────────────
         IDs come from build-time env vars (Cloudflare Pages → Settings →
         Environment variables):
             VITE_GA4_ID                    G-XXXXXXXXXX
             VITE_META_PIXEL_ID             000000000000000
             VITE_FB_DOMAIN_VERIFICATION    domain verification token
         Empty values mean that tracker simply never initialises. -->
    <script>
      (function () {
        var GA4 = "%VITE_GA4_ID%";
        var ADS = "%VITE_GOOGLE_ADS_ID%";
        var PIXEL = "%VITE_META_PIXEL_ID%";
        var ok = function (v) { return v && v.indexOf("VITE_") === -1 && v.indexOf("%") === -1; };

        /* Capture fbclid into a _fbc cookie BEFORE the Pixel loads.
           Roughly a quarter to a third of Bangladeshi mobile sessions block or
           badly delay fbevents.js. Those clicks used to arrive with no click ID
           at all and were permanently unattributable — the server events had
           nothing to join on. Writing the cookie ourselves means CAPI can still
           credit the ad even when the browser Pixel never runs. */
        try {
          if (!/(^|;\s*)_fbc=/.test(document.cookie)) {
            var fbclid = new URLSearchParams(location.search).get("fbclid");
            if (fbclid) {
              document.cookie =
                "_fbc=fb.1." + Date.now() + "." + fbclid +
                ";expires=" + new Date(Date.now() + 7776e6).toUTCString() +
                ";path=/;SameSite=Lax";
            }
          }
        } catch (e) {}

        if (ok(GA4) || ok(ADS)) {
          var g = document.createElement("script");
          g.async = true;
          g.src = "https://www.googletagmanager.com/gtag/js?id=" + (ok(GA4) ? GA4 : ADS);
          document.head.appendChild(g);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { dataLayer.push(arguments); };
          gtag("js", new Date());

          if (ok(GA4)) gtag("config", GA4, { send_page_view: false });

          /* Google Ads needs its own config on the same gtag instance.
             GA4's purchase event does NOT feed Ads bidding by itself — without
             an AW- config plus a conversion label, Smart Bidding and
             Performance Max optimise toward clicks instead of orders.
             allow_enhanced_conversions lets the Ads tag use the hashed phone
             we already collect at checkout, which recovers conversions that
             cookie loss would otherwise drop. */
          if (ok(ADS)) gtag("config", ADS, { allow_enhanced_conversions: true });
        }

        if (ok(PIXEL)) {
          !(function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
              n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0";
            n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
          })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
          fbq("init", PIXEL);
          /* The ONLY PageView on initial load. tracker.js skips its first
             route-change call to match — previously both fired, doubling
             Landing Page Views in Ads Manager and halving every conversion
             rate that divides by them. */
          fbq("track", "PageView");
        }
      })();
    </script>
